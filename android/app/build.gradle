plugins {
    id 'com.android.application'
}

android {
    namespace 'org.ronnie.zarecomp'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.ronnie.zarecomp'
        minSdk 28
        targetSdk 36
        versionCode 6
        versionName '0.5.1-auto-storage-probe-fix'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['src/main/cpp/SDL/android-project/app/src/main/java']
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            // Separate package so this APK can be installed alongside the
            // existing .debug app even when the ephemeral CI signing key differs.
            applicationIdSuffix '.storageprobe'
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
