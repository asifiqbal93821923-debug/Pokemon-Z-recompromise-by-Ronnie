plugins {
    id 'com.android.application'
}

android {
    namespace 'org.ronnie.zarecomp'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.ronnie.zarecomp'
        minSdk 28
        targetSdk 36
        versionCode 17
        versionName '0.6.8-phase1-core-check'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['src/main/cpp/SDL/android-project/app/src/main/java']
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            // Unique package so this build installs side-by-side with earlier diagnostic
            // APKs even when GitHub Actions uses a different ephemeral signing key.
            applicationIdSuffix '.phase1core'
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
