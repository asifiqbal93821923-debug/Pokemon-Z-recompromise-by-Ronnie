name: Android SDL3 Smoke Build

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-smoke.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-sdl3-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64-debug:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout port project
        uses: actions/checkout@v4

      - name: Checkout pinned SDL3 source
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.18
          path: android/app/src/main/cpp/SDL

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Locate Android SDK tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "Found sdkmanager at $SDKMANAGER"

      - name: Accept licenses and install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build arm64 debug APK
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-za-android-sdl3-smoke-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
